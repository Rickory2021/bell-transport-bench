# scripts/flatten-sync/profiles/default.flatten.config.example.yaml
#
# Full repo export for Claude Project upload (bell-transport-bench).
# Copy to default.flatten.config.yaml (gitignored) to customise locally.
#
# Resolution: default.flatten.config.yaml (yours) > default.flatten.config.example.yaml
root:
  __path: .
  __modifier:
    exclude:
      - [dev-env, generated-files, build-output, active-configs, secrets, script-data, binary-assets, workspace-scratch, result-images, first-results]
  __note: "Repo root (README, CONTRIBUTING, Makefile, pyproject)"
  src:
    __path: src
    __note: "bellbench package: all benchmark logic"
  config:
    __path: config
    __note: "bp schemas, data, enums, invokes: processor models, noise profiles, run configs"
  notebooks:
    __path: notebooks
    __note: "Tutorials and the generated submission notebook"
  docs:
    __path: docs
    __note: "DESIGN.md: design decisions and their reasons"
  tests:
    __path: tests
    __note: "pytest suite"
  scripts:
    __path: scripts
    __note: "blueprint-render and flatten-sync tooling"
