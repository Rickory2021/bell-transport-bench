  - id: guillaud-mirrahimi-2019-repetition-cat-qubits
    title: "Repetition Cat Qubits for Fault-Tolerant Quantum Computation"
    authors: [Jérémie Guillaud, Mazyar Mirrahimi]
    year: 2019
    kind: paper
    url: https://doi.org/10.1103/PhysRevX.9.041053
    download: https://arxiv.org/pdf/1904.09474v4
    snapshot: null
    redistribution: open-license
    checked: false
    summary: >-
      Proposes a one-dimensional repetition code of cat qubits whose bit flips are strongly
      suppressed, so only phase flips need correcting, with gates chosen to keep that noise bias.
      Physical Review X 9, 041053 (2019), published under CC BY 4.0. Our biased-noise study asks
