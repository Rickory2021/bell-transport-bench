# docs/bp.data.references.yaml
#
# Every source the project relies on: links, a summary in our own words,
# and the specific claims we take from it. Validated by
# bp.schema.references.yaml. Copies are never committed; run
# `make refs-fetch` to download the ones with a `download` link into
# the gitignored .references/ folder.
#
# checked: false means the takeaway came from a secondary account (our
# research reports) and must be confirmed against the original before
# it appears in the submission notebook or the video.

