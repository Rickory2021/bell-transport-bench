  # -- Papers in hand (read in full) ------------------------------------------

  - id: replacement-type-gates
    title: "Replacement-Type Quantum Gates"
    authors: [Florian Ginzel, Javad Kazemi, Valentin Torggler, Wolfgang Lechner]
    year: 2025
    kind: paper
    url: https://arxiv.org/abs/2508.00437v3
    download: https://arxiv.org/pdf/2508.00437v3
    snapshot: null
    redistribution: link-only
    checked: true
    summary: >-
      Proposes gates that never rotate the qubit: candidate qubits are prepared in the states the
      gate should produce, the input qubit decides which candidate moves to the output site, and
      the rest are measured away. This keeps a qubit's natural bias toward phase errors through
      the gate, with spin-qubit and neutral-atom realisations.
    takeaways:
      - claim: "A noise-bias-preserving CNOT is impossible on a strictly two-level system; bias-preserving gates need a larger state space."
        locator: "Sec. I, citing its reference 15"
        used_in: [docs/DESIGN.md]
      - claim: "Simulated rearrangement fidelities with realistic spin-qubit parameters: about 98.9% for X and 92.6% for CNOT, dominated by phase errors."
        locator: "Fig. 7"
        used_in: [docs/DESIGN.md]
      - claim: "The XZZX surface code tolerates about 7.8% error at a noise bias of 100, which is why a lower-fidelity but strongly biased gate can still be useful."
        locator: "Sec. III.D"
        used_in: [docs/DESIGN.md]

  - id: johnstun-2021-ibm-noise
    title: "Understanding and compensating for noise on IBM quantum computers"
    authors: [Scott Johnstun, Jean-François Van Huele]
    year: 2021
    kind: paper
    url: https://doi.org/10.1119/10.0006204
    download: null
    snapshot: null
    redistribution: link-only
    checked: true
    summary: >-
      An American Journal of Physics teaching paper that runs Simon's algorithm on IBM devices and
      shows how transpilation onto limited connectivity adds CNOTs that dominate the error.
    takeaways:
      - claim: "ibmq_london had the same T-shaped five-qubit graph as our 2016 model, with CNOT errors between about 0.7% and 2.2% and single-qubit errors around 0.04%."
        locator: "Fig. 1(a)"
        used_in: [docs/DESIGN.md]
      - claim: "Routing cost dominates: for n = 6 the transpiler grew 11 CNOTs to 68, cutting the chance of no CNOT error from about 98% to about 32% even at the best per-gate rate."
        locator: "Sec. V.C"
        used_in: [docs/DESIGN.md]

