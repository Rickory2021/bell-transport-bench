# pyproject.toml
#
# bell-transport-bench: benchmark for Bell-pair transport and error detection
# across processor models (Qiskit Fall Fest 2026, quanTA challenge).
# The scripts under scripts/ keep their own pyproject files and run via uv.

[project]
name = "bell-transport-bench"
version = "0.1.0"
description = "Bell-pair transport and error-detection benchmark across coupling graphs and noise profiles"
requires-python = ">=3.12"
dependencies = [
    # Qiskit stack, pinned exactly so every result is reproducible.
    # qiskit 2.6.2 matches the version the Fall Fest compilation deck read.
    # qiskit-ibm-runtime 0.51.0, not 0.52.0: 0.52.0 was two days old at setup.
    "qiskit==2.6.2",
    "qiskit-aer==0.18.2",
    "qiskit-ibm-runtime==0.51.0",
    "networkx==3.7",
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "jsonschema>=4.20",
    "pylatexenc==2.10",
]

[dependency-groups]
dev = ["pytest", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bellbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
