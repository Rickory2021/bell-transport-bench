recommendation:
  statement: >-
    Give a future cloud processor at least two qubit-disjoint paths between qubits that
    must share entanglement, so a parity check can run on a spare path and read at the
    end of the circuit.
  reasoning: >-
    On the two graphs with spare paths, the XX check raised F above the move chain alone
    (section 4.2); on the graph with one path, the check had to read a qubit mid-circuit
    and did not pay, even with no mid-circuit measurement error (appendix A.1). The
