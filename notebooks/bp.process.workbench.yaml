# notebooks/bp.process.workbench.yaml
#
# Renders the workbench notebook, Part 3 of the workspace, from its template
# (docs/DESIGN.md, section 1). The invoke supplies the noise profile the session
# starts on; the Workbench takes its base seed from the core benchmark when the
# notebook runs.

vars:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  type: object
  additionalProperties: false
  required: [noise]
  properties:
    noise:
      description: The noise profile the session starts on.
      type: string
      pattern: '^[a-z0-9][a-z0-9-]*$'

map:
  defaults.noise: {var: noise}

emit:
  ipynb:
    render: scripts/blueprint-render/renderers/ipynb.py
    template: notebooks/templates/workbench.py.j2

output: adjacent
