# config/bp.schema.runs.yaml
#
# Validates bp.data.runs.yaml in each benchmark folder,
# results/runs/benchmark/<name>/<stamp>/ or workspace/runs/benchmark/<name>/<stamp>/:
# the run list a benchmark writes, naming the benchmark file it was made from
# and the runs its comparison table was built from (docs/DESIGN.md, section 6).
# Each run is the folder beside the list named by its run id, and the folder's
# stamp is when the benchmark was made. src/bellbench/run.py checks a run list
# against this schema when it writes one.

$schema: "https://json-schema.org/draft/2020-12/schema"
title: Run list
description: The benchmark file a benchmark was made from, its run ids, and which run fills which case.

type: object
required: [benchmark, runs, cases]
additionalProperties: false

$defs:
  slug:
    type: string
    pattern: '^[a-z0-9][a-z0-9-]*$'

properties:
  benchmark:
    description: The benchmark file by its repo-relative path and the hash of its parsed content.
    type: object
    required: [path, hash]
    additionalProperties: false
    properties:
      path: {type: string, pattern: '^config/benchmark/bp\.data\.benchmark\.[a-z0-9][a-z0-9-]*\.yaml$'}
      hash: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  runs:
    description: The benchmark file's run ids, in its order; each names the run folder beside this list.
    type: array
    minItems: 1
    uniqueItems: true
    items: {$ref: "#/$defs/slug"}
  cases:
    description: >-
      The benchmark file's cases, each one of the challenge's nine cases filled by a
      run and a simulation; empty when it has none.
    type: array
    items:
      type: object
      required: [case, run, simulation]
      additionalProperties: false
      properties:
        case: {type: integer, minimum: 1, maximum: 9}
        run: {$ref: "#/$defs/slug"}
        simulation: {enum: [ideal, noisy]}
