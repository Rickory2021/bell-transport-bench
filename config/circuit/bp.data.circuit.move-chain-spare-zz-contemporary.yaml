# config/circuit/bp.data.circuit.move-chain-spare-zz-contemporary.yaml

name: move-chain-spare-zz-contemporary
label: move_chain + zz spare, contemporary
processor: contemporary
analysis:
  name: parity
  settings:
    checks:
    - - check_zz[0]
    frame_z:
    - frame_z_zz[0]
    - frame_z_zz[1]
notes: >-
  Built by src/bellbench/builders.py on contemporary along the path [0, 1, 2, 3, 7]:
  move_chain(); then bus_zz(on=[0, 4, 5, 6, 7], reset=False).
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[1] check_zz;
  bit[2] frame_z_zz;
  qubit[9] q;
  h q[0];
  cx q[0], q[1];
  cx q[1], q[2];
  cx q[2], q[1];
  cx q[2], q[3];
  cx q[3], q[2];
  cx q[3], q[7];
  cx q[7], q[3];
  cx q[0], q[4];
  cx q[4], q[5];
  cx q[5], q[6];
  cx q[7], q[6];
  check_zz[0] = measure q[6];
  h q[4];
  frame_z_zz[0] = measure q[4];
  h q[5];
  frame_z_zz[1] = measure q[5];
