# config/circuit/bp.data.circuit.move-chain-vacancy-contemporary.yaml

name: move-chain-vacancy-contemporary
label: move_chain then vacancy at the end, contemporary
processor: contemporary
analysis:
  name: parity
  settings:
    checks:
    - - check_vac[0]
    - - check_vac[1]
    - - check_vac[2]
notes: >-
  Built by src/bellbench/builders.py on contemporary along the path [0, 1, 2, 3, 7]:
  move_chain(); then vacancy().
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[3] check_vac;
  qubit[9] q;
  h q[0];
  cx q[0], q[1];
  cx q[1], q[2];
  cx q[2], q[1];
  cx q[2], q[3];
  cx q[3], q[2];
  cx q[3], q[7];
  cx q[7], q[3];
  check_vac[0] = measure q[1];
  check_vac[1] = measure q[2];
  check_vac[2] = measure q[3];
