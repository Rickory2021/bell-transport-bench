# config/circuit/bp.data.circuit.ghz-uncompute-vacancy-spare-xx-hyperbolic.yaml

name: ghz-uncompute-vacancy-spare-xx-hyperbolic
label: ghz_uncompute then vacancy, then bus_xx on a spare path, hyperbolic
processor: hyperbolic
analysis:
  name: parity
  settings:
    checks:
    - - check_vac[0]
    - - check_vac[1]
    - - check_xx[0]
      - check_xx[1]
notes: >-
  Built by src/bellbench/builders.py on hyperbolic along the path [0, 1, 9, 12]: ghz_uncompute();
  then vacancy(); then bus_xx(on=[0, 3, 11, 12], reset=False).
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[2] check_vac;
  bit[2] check_xx;
  qubit[13] q;
  h q[0];
  cx q[0], q[1];
  cx q[1], q[9];
  cx q[9], q[12];
  cx q[1], q[9];
  cx q[0], q[1];
  check_vac[0] = measure q[1];
  check_vac[1] = measure q[9];
  h q[3];
  cx q[3], q[11];
  cx q[3], q[0];
  cx q[11], q[12];
  h q[3];
  check_xx[0] = measure q[3];
  h q[11];
  check_xx[1] = measure q[11];
