# config/circuit/bp.data.circuit.move-chain-xx-spare-zz-path-contemporary.yaml

name: move-chain-xx-spare-zz-path-contemporary
label: move_chain + xx spare + zz path, contemporary
processor: contemporary
analysis:
  name: parity
  settings:
    checks:
    - - check_xx[0]
      - check_xx[1]
      - check_xx[2]
    - - check_vac_zz[0]
    - - check_vac_zz[1]
    - - check_vac_zz[2]
    - - check_zz[0]
    frame_z:
    - frame_z_zz[0]
    - frame_z_zz[1]
notes: >-
  Built by src/bellbench/builders.py on contemporary along the path [0, 1, 2, 3, 7]:
  move_chain(); then bus_xx(on=[0, 4, 5, 6, 7], reset=False); then bus_zz(reset=False).
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[3] check_xx;
  bit[3] check_vac_zz;
  bit[1] check_zz;
  bit[2] frame_z_zz;
  qubit[9] q;
  h q[0];
  cx q[0], q[1];
  cx q[1], q[2];
  cx q[2], q[1];
  cx q[2], q[3];
  cx q[3], q[2];
  cx q[3], q[7];
  cx q[7], q[3];
  h q[4];
  cx q[4], q[5];
  cx q[5], q[6];
  cx q[4], q[0];
  cx q[6], q[7];
  h q[4];
  check_xx[0] = measure q[4];
  h q[5];
  check_xx[1] = measure q[5];
  h q[6];
  check_xx[2] = measure q[6];
  check_vac_zz[0] = measure q[1];
  check_vac_zz[1] = measure q[2];
  check_vac_zz[2] = measure q[3];
  cx q[0], q[1];
  cx q[1], q[2];
  cx q[2], q[3];
  cx q[7], q[3];
  check_zz[0] = measure q[3];
  h q[1];
  frame_z_zz[0] = measure q[1];
  h q[2];
  frame_z_zz[1] = measure q[2];
