# config/circuit/bp.data.circuit.baseline-ibm2016.yaml

name: baseline-ibm2016
label: Baseline, 2016-inspired reference
processor: ibm2016
analysis: postselect
notes: >-
  The baseline transport (swap_chain in src/bellbench/circuits.py), the organisers'
  recipe: H on the first port, explicit SWAPs out along the path [0, 3, 4], the lexicographically
  smallest shortest path between the ports, CX onto the second port, and the same
  SWAPs back, so the pair ends on the ports. No checks, so postselection keeps every
  shot.
circuit: |
  OPENQASM 2.0;
  include "qelib1.inc";
  qreg q[5];
  h q[0];
  swap q[0],q[3];
  cx q[3],q[4];
  swap q[0],q[3];
