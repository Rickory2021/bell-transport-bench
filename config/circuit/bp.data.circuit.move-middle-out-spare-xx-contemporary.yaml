# config/circuit/bp.data.circuit.move-middle-out-spare-xx-contemporary.yaml

name: move-middle-out-spare-xx-contemporary
label: move_middle_out then bus_xx on a spare path, contemporary
processor: contemporary
analysis:
  name: parity
  settings:
    checks:
    - - check_xx[0]
      - check_xx[1]
      - check_xx[2]
notes: Built in the Workbench from a Qiskit circuit.
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[3] check_xx;
  qubit[9] q;
  h q[1];
  cx q[1], q[2];
  cx q[1], q[0];
  cx q[0], q[1];
  cx q[2], q[3];
  cx q[3], q[2];
  cx q[3], q[7];
  cx q[7], q[3];
  h q[4];
  cx q[4], q[5];
  cx q[5], q[6];
  cx q[4], q[0];
  cx q[6], q[7];
  h q[4];
  check_xx[0] = measure q[4];
  h q[5];
  check_xx[1] = measure q[5];
  h q[6];
  check_xx[2] = measure q[6];
