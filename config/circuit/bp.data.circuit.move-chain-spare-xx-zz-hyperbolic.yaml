# config/circuit/bp.data.circuit.move-chain-spare-xx-zz-hyperbolic.yaml

name: move-chain-spare-xx-zz-hyperbolic
label: move_chain + xx + zz spare, hyperbolic
processor: hyperbolic
analysis:
  name: parity
  settings:
    checks:
    - - check_xx[0]
      - check_xx[1]
    - - check_zz[0]
    frame_z:
    - frame_z_zz[0]
    - frame_z_zz[1]
notes: >-
  Built by src/bellbench/builders.py on hyperbolic along the path [0, 1, 9, 12]: move_chain();
  then bus_xx(on=[0, 3, 11, 12], reset=False); then bus_zz(on=[0, 2, 6, 10, 12], reset=False).
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[2] check_xx;
  bit[1] check_zz;
  bit[2] frame_z_zz;
  qubit[13] q;
  h q[0];
  cx q[0], q[1];
  cx q[1], q[9];
  cx q[9], q[1];
  cx q[9], q[12];
  cx q[12], q[9];
  h q[3];
  cx q[3], q[11];
  cx q[3], q[0];
  cx q[11], q[12];
  h q[3];
  check_xx[0] = measure q[3];
  h q[11];
  check_xx[1] = measure q[11];
  cx q[0], q[2];
  cx q[2], q[6];
  cx q[6], q[10];
  cx q[12], q[10];
  check_zz[0] = measure q[10];
  h q[2];
  frame_z_zz[0] = measure q[2];
  h q[6];
  frame_z_zz[1] = measure q[6];
