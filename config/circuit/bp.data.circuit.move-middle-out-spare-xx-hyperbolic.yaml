# config/circuit/bp.data.circuit.move-middle-out-spare-xx-hyperbolic.yaml

name: move-middle-out-spare-xx-hyperbolic
label: move_middle_out then bus_xx on a spare path, hyperbolic
processor: hyperbolic
analysis:
  name: parity
  settings:
    checks:
    - - check_xx[0]
      - check_xx[1]
notes: Built in the Workbench from a Qiskit circuit.
circuit: |
  OPENQASM 3.0;
  include "stdgates.inc";
  bit[2] check_xx;
  qubit[13] q;
  h q[1];
  cx q[1], q[9];
  cx q[1], q[0];
  cx q[0], q[1];
  cx q[9], q[12];
  cx q[12], q[9];
  h q[3];
  cx q[3], q[11];
  cx q[3], q[0];
  cx q[11], q[12];
  h q[3];
  check_xx[0] = measure q[3];
  h q[11];
  check_xx[1] = measure q[11];
