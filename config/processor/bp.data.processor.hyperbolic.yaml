# The Hyperbolic-inspired processor model, the organisers' graph (docs/DESIGN.md, section 3).
# Validated by config/bp.schema.processor.yaml.

name: hyperbolic
label: Hyperbolic-inspired model
reference: ideal-and-noisy-example
notes: >-
