# config/benchmark/bp.data.benchmark.deliverable-2026-11-17-extended-contemporary.yaml

name: deliverable-2026-11-17-extended-contemporary
label: Contemporary, the protected case beside its alternatives
notes: >-
  An optional study, kept apart from the nine cases (docs/CHALLENGE.md, What is fixed
  and what we choose): on the contemporary graph, the deliverable's protected case,
  case 6, beside the circuits that differ from it by one step, so each comparison
  shows what one change buys. The rungs, each a builder call along the baseline's path
  [0, 1, 2, 3, 7]: the organisers' baseline; the move chain, which moves the pair with
  two CX gates a hop instead of a SWAP's three; ghz_measure, the textbook GHZ
  transport, which reads the interior qubits in X and owes a Z on the first port for
  each 1; ghz_uncompute, which empties the interior with gates instead; ghz_measure
  again with no readout error on the interior qubits it reads, an override only this
  run takes, which shows whether readout error alone decides between the two GHZ
  transports; each of the two empty transports followed by a vacancy read at the end,
  where only ghz_uncompute's last gate makes the read catch a bit flip on the first
  port; and two XX checks on a spare path that shares no qubit with the pair's: the
  move-chain benchmark's case 6, the move chain with the check, and ghz_uncompute with
  its vacancy read followed by the check, which trades discarded shots for F. Both XX
  buses on this graph pass through its five-edge qubit, so their numbers are without
  the planned degree penalty (docs/DESIGN.md, section 4). Every run takes the
  deliverable's noise profile, shots and base seed, so the runs it shares with the
  deliverable repeat its numbers exactly; the runs it shares with the move-chain
  benchmark, which takes 20,000 shots, agree with them within their errors.
shots: 100000
base_seed: 20261116
runs:
  # The reference: the organisers' baseline.
  - {run: baseline-contemporary, circuit: baseline-contemporary, noise: boston-2026}
  # The transports alone, with no check.
  - {run: move-chain-contemporary, circuit: move-chain-contemporary, noise: boston-2026}
  - {run: ghz-measure-contemporary, circuit: ghz-measure-contemporary, noise: boston-2026}
  # ghz_measure with no readout error on the interior qubits [1, 2, 3], the only run here that changes the profile.
  - {run: ghz-measure-contemporary-readout-0, circuit: ghz-measure-contemporary, noise: boston-2026, overrides: [{qubits: 1, field: qubit.readout_error.reads_1_when_0, value: 0.0}, {qubits: 1, field: qubit.readout_error.reads_0_when_1, value: 0.0}, {qubits: 2, field: qubit.readout_error.reads_1_when_0, value: 0.0}, {qubits: 2, field: qubit.readout_error.reads_0_when_1, value: 0.0}, {qubits: 3, field: qubit.readout_error.reads_1_when_0, value: 0.0}, {qubits: 3, field: qubit.readout_error.reads_0_when_1, value: 0.0}]}
  - {run: ghz-uncompute-contemporary, circuit: ghz-uncompute-contemporary, noise: boston-2026}
  # A vacancy read at the end after each transport that empties the path; the second is the deliverable's protected case.
  - {run: move-chain-vacancy-contemporary, circuit: move-chain-vacancy-contemporary, noise: boston-2026}
  - {run: ghz-uncompute-vacancy-contemporary, circuit: ghz-uncompute-vacancy-contemporary, noise: boston-2026}
  # XX checks on a spare path: the move-chain benchmark's case 6, then the vacancy read followed by the check.
  - {run: move-chain-spare-xx-contemporary, circuit: move-chain-spare-xx-contemporary, noise: boston-2026}
  - {run: ghz-uncompute-vacancy-spare-xx-contemporary, circuit: ghz-uncompute-vacancy-spare-xx-contemporary, noise: boston-2026}
