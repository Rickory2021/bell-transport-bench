# config/benchmark/bp.data.benchmark.deliverable-2026-11-17.yaml

name: deliverable-2026-11-17
label: GHZ disentangling with a vacancy read, the nine cases
notes: >-
  The challenge's nine cases (docs/CHALLENGE.md, The nine core cases) as the
  submission reports them, under boston-2026 as in the core benchmark, so the three
  graphs differ only in connectivity. Cases 1, 2, 4, 5, 7 and 8 are the organisers'
  baseline, exactly as the core benchmark runs it. Cases 3, 6 and 9 are one protection
  strategy, the same builder steps on every graph: ghz_uncompute makes a GHZ state
  along the pair's path, then disentangles the path's interior qubits with gates
  controlled from the first port, leaving them in |0>; vacancy then reads them at the
  end of the circuit, and postselection discards each shot where any reads 1. The read
  catches a bit flip on the interior qubits and on the first port, the qubit that has
  waited longest, since the last gate copies it onto the path; it cannot see a phase
  flip. No qubit is read mid-circuit, so no case needs the mid-circuit measurement
  channel. The file runs only the runs that fill a case. Each graph's extended
  benchmark, deliverable-2026-11-17-extended-<processor>, runs the same protected case
  beside the alternatives under the same shots and seed, among them the transport
  without the read, so the submission separates what the transport buys from what the
  read buys. Every run takes 100,000 shots per basis, five times the core's 20,000, so
  F's standard error is about 0.0003 and a difference of 0.001 between two runs stands
  at more than two combined standard errors; the baseline cases therefore agree with
  the core's within their errors rather than repeating its numbers.
shots: 100000
base_seed: 20261116
runs:
  # The reference: the organisers' baseline.
  - {run: baseline-ibm2016, circuit: baseline-ibm2016, noise: boston-2026}
  - {run: baseline-contemporary, circuit: baseline-contemporary, noise: boston-2026}
  - {run: baseline-hyperbolic, circuit: baseline-hyperbolic, noise: boston-2026}
  # The protection: the transport with its vacancy read at the end.
  - {run: ghz-uncompute-vacancy-ibm2016, circuit: ghz-uncompute-vacancy-ibm2016, noise: boston-2026}
  - {run: ghz-uncompute-vacancy-contemporary, circuit: ghz-uncompute-vacancy-contemporary, noise: boston-2026}
  - {run: ghz-uncompute-vacancy-hyperbolic, circuit: ghz-uncompute-vacancy-hyperbolic, noise: boston-2026}
cases:
  - {case: 1, run: baseline-ibm2016, simulation: ideal}
  - {case: 2, run: baseline-ibm2016, simulation: noisy}
  - {case: 3, run: ghz-uncompute-vacancy-ibm2016, simulation: noisy}
  - {case: 4, run: baseline-contemporary, simulation: ideal}
  - {case: 5, run: baseline-contemporary, simulation: noisy}
  - {case: 6, run: ghz-uncompute-vacancy-contemporary, simulation: noisy}
  - {case: 7, run: baseline-hyperbolic, simulation: ideal}
  - {case: 8, run: baseline-hyperbolic, simulation: noisy}
  - {case: 9, run: ghz-uncompute-vacancy-hyperbolic, simulation: noisy}
