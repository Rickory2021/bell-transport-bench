# config/benchmark/bp.data.benchmark.vacancy-read.yaml

name: vacancy-read
label: Vacancy-read study
notes: >-
  An optional study, kept apart from the nine cases (docs/CHALLENGE.md, What is fixed
  and what we choose): does a GHZ-and-uncompute transport, followed by a vacancy read
  of the emptied path at the end, do better than the reported strategy? ghz_uncompute
  makes a GHZ state along the path, then empties the interior with gates controlled
  from the first port, so the vacancy read at the end catches a bit flip on that port,
  the qubit that has waited longest. On ibm2016 the vacancy read replaces case 3's XX
  check on the path, which reads a qubit mid-circuit and reuses it; on the
  contemporary and hyperbolic graphs the reported XX check on a spare path follows it.
  Each new run sits beside the move-chain benchmark's protected run on its graph,
  rerun here under the same circuit, profile and base seed, so with the same seeds and
  the same numbers. Case 3's run appears twice: at the mid-circuit measurement error
  of 0.01 it is reported with, and at 0, the Boston profile alone, under which every
  new run here needs no channel. The contemporary runs' XX bus passes through the
  five-edge qubit, so their numbers are without the planned degree penalty
  (docs/DESIGN.md, section 4). Every run takes 20,000 shots per basis, as in the core.
shots: 20000
base_seed: 20261116
runs:
  # The reference: the move-chain benchmark's protected runs, case 3's also without the mid-circuit error.
  - {run: path-xx-ibm2016, circuit: move-chain-path-xx-ibm2016, noise: boston-2026, conditional: {mid_circuit_measurement_error: 0.01}}
  - {run: path-xx-ibm2016-mcm-0, circuit: move-chain-path-xx-ibm2016, noise: boston-2026, conditional: {mid_circuit_measurement_error: 0.0}}
  - {run: spare-xx-contemporary, circuit: move-chain-spare-xx-contemporary, noise: boston-2026}
  - {run: spare-xx-hyperbolic, circuit: move-chain-spare-xx-hyperbolic, noise: boston-2026}
  # GHZ and uncompute, then a vacancy read at the end; then the XX check on a spare path where one exists.
  - {run: ghz-vacancy-ibm2016, circuit: ghz-uncompute-vacancy-ibm2016, noise: boston-2026}
  - {run: ghz-vacancy-xx-contemporary, circuit: ghz-uncompute-vacancy-spare-xx-contemporary, noise: boston-2026}
  - {run: ghz-vacancy-xx-hyperbolic, circuit: ghz-uncompute-vacancy-spare-xx-hyperbolic, noise: boston-2026}
