# config/benchmark/bp.data.benchmark.deliverable-2026-11-17-extended-ibm2016.yaml

name: deliverable-2026-11-17-extended-ibm2016
label: 2016-inspired, the protected case beside its alternatives
notes: >-
  An optional study, kept apart from the nine cases (docs/CHALLENGE.md, What is fixed
  and what we choose): on the 2016-inspired graph, the deliverable's protected case,
  case 3, beside the circuits that differ from it by one step, so each comparison
  shows what one change buys. The rungs, each a builder call along the baseline's path
  [0, 3, 4]: the organisers' baseline; the move chain, which moves the pair with two
  CX gates a hop instead of a SWAP's three; ghz_measure, the textbook GHZ transport,
  which reads the interior qubits in X and owes a Z on the first port for each 1;
  ghz_uncompute, which empties the interior with gates instead; ghz_measure again with
  no readout error on the interior qubits it reads, an override only this run takes,
  which shows whether readout error alone decides between the two GHZ transports; each
  of the two empty transports followed by a vacancy read at the end, where only
  ghz_uncompute's last gate makes the read catch a bit flip on the first port; and the
  move-chain benchmark's case 3, the move chain with an XX check on the pair's own
  path, which reads a qubit mid-circuit and runs with the mid-circuit measurement
  error of 0.01 it was reported with. The graph has no spare path, so no rung adds an
  XX check to the vacancy read. Every run takes the deliverable's noise profile, shots
  and base seed, so the runs it shares with the deliverable repeat its numbers
  exactly; the runs it shares with the move-chain benchmark, which takes 20,000 shots,
  agree with them within their errors.
shots: 100000
base_seed: 20261116
runs:
  # The reference: the organisers' baseline.
  - {run: baseline-ibm2016, circuit: baseline-ibm2016, noise: boston-2026}
  # The transports alone, with no check.
  - {run: move-ibm2016, circuit: move-chain-ibm2016, noise: boston-2026}
  - {run: ghz-measure-ibm2016, circuit: ghz-measure-ibm2016, noise: boston-2026}
  # ghz_measure with no readout error on the interior qubits [3], the only run here that changes the profile.
  - {run: ghz-measure-readout-0-ibm2016, circuit: ghz-measure-ibm2016, noise: boston-2026, overrides: [{qubits: 3, field: qubit.readout_error.reads_1_when_0, value: 0.0}, {qubits: 3, field: qubit.readout_error.reads_0_when_1, value: 0.0}]}
  - {run: ghz-ibm2016, circuit: ghz-uncompute-ibm2016, noise: boston-2026}
  # A vacancy read at the end after each transport that empties the path; the second is the deliverable's protected case.
  - {run: move-vacancy-ibm2016, circuit: move-chain-vacancy-ibm2016, noise: boston-2026}
  - {run: ghz-vacancy-ibm2016, circuit: ghz-uncompute-vacancy-ibm2016, noise: boston-2026}
  # The move-chain benchmark's case 3: the move chain with its XX check on the path, read mid-circuit.
  - {run: path-xx-ibm2016, circuit: move-chain-path-xx-ibm2016, noise: boston-2026, conditional: {mid_circuit_measurement_error: 0.01}}
